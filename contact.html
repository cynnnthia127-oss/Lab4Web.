<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="stylecont.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Contact</h1>
        </header>

        <nav>
            <a href="home.html">Home</a>
            <a href="artikel.html">Artikel</a>
            <a href="about.html">About</a>
            <a href="contact.html" class="active">Kontak</a>
        </nav>

        <section class="hero">
            <h2>Hubungi Saya</h2>
            <p>Silakan isi formulir di bawah ini.</p>
        </section>

        <main class="contact-layout">
            <section class="content-card form-card">
                <h2>Formulir Kontak</h2>
                <form action="#" method="post">
                    <label for="nama">Nama Lengkap</label>
                    <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Masukkan email" required>

                    <label for="subjek">Subjek</label>
                    <input type="text" id="subjek" name="subjek" placeholder="Masukkan subjek pesan">

                    <label for="pesan">Pesan</label>
                    <textarea id="pesan" name="pesan" rows="5" placeholder="Tulis pesan kamu" required></textarea>

                    <button type="submit" class="btn">Kirim Pesan</button>
                </form>
            </section>

            <aside class="content-card info-card">
                <h2>Informasi Kontak</h2>
                <p><strong>Nama:</strong> Fahreza Pratama Yudha</p>
                <p><strong>NIM:</strong> 312510287</p>
                <p>Terima kasih telah mengunjungi website ini.</p>
            </aside>
        </main>

        <footer>
            <p>&copy; 2026 - Universitas Pelita Bangsa</p>
        </footer>
    </div>

</body>
</html>
